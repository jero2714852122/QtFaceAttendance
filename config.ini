; QtFaceAttendance 运行配置
;
; 改完这个文件，重启程序就生效，不用重新编译。
; 文件删掉也不会崩，程序会用内置的默认值继续跑。

[client]
; 客户端要连的服务器地址。
; 同一台电脑上测试就写 127.0.0.1；
; 跨电脑测试时写服务端那台机器的局域网地址，比如 192.168.1.23。
server_address=127.0.0.1

; 客户端要连的端口，必须和服务端的 listen_port 一致。
server_port=45454

[server]
; 服务端在哪个地址上等人来连。
; 127.0.0.1 只接受本机连接；想接受局域网里其他电脑的连接要改成 0.0.0.0。
listen_address=127.0.0.1

; 服务端监听的端口。
listen_port=45455
